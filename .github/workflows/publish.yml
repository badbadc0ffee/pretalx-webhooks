name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pretalx-webhooks
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run --extra=dev python -c
          "import os; from pretalx_webhooks import __version__;
          assert os.environ['RELEASE_TAG'].removeprefix('v') == __version__"
      - name: Build package
        run: uv run --extra=dev python -m build
      - name: Check package
        run: uv run --extra=dev python -m twine check dist/*
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
