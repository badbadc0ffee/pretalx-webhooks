name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pretalx
        options: >-
          --health-cmd "pg_isready -U postgres -d pretalx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Install PostgreSQL driver
        if: matrix.database == 'postgres'
        run: uv sync --extra=dev && uv pip install psycopg2-binary
      - name: Run tests with SQLite
        if: matrix.database == 'sqlite'
        run: just test --cov-report=xml
      - name: Run tests with PostgreSQL
        if: matrix.database == 'postgres'
        run: just test --cov-report=xml
        env:
          PRETALX_DB_TYPE: postgresql
          PRETALX_DB_NAME: pretalx
          PRETALX_DB_USER: postgres
          PRETALX_DB_PASS: postgres
          PRETALX_DB_HOST: localhost
      - name: Check code and template style
        if: matrix.database == 'sqlite'
        run: just fmt-check
      - name: Check package manifest
        if: matrix.database == 'sqlite'
        run: just check-manifest
      - name: Build package
        if: matrix.database == 'sqlite'
        run: uv run --extra=dev python -m build
      - name: Check package
        if: matrix.database == 'sqlite'
        run: uv run --extra=dev python -m twine check dist/*
